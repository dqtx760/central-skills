interface:
  display_name: "dqtx-WeFlow-Daily"
  short_description: "指定群名，通过 WeFlow MCP 生成 HTML 日报"
  default_prompt: "使用 $dqtx-WeFlow-Daily，为指定群生成今日 HTML 日报。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai, generic]
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    generic: "neutral-source"
